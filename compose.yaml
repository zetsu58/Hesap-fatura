services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hesapfatura
      POSTGRES_USER: hesapfatura
      POSTGRES_PASSWORD: local-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hesapfatura"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
volumes:
  postgres-data:
